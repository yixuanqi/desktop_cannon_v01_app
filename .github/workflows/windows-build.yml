name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 编译
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 验证版本号一致性
        run: npm run test:version

      - name: 运行自动化测试
        run: npm test

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装素材及 UI 测试依赖
        run: |
          python -m pip install numpy pillow playwright
          python -m playwright install chromium

      - name: 浏览器 UI 实际交互测试
        run: python scripts/ui_smoke.py

      - name: 校验小炮美术网格帧
        run: python scripts/validate_mesh.py

      - name: 运行 Windows Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建安装版与绿色版
        run: npm run build

      - name: 整理绿色版（便携 zip）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/desktop-cannon.exe dist/DesktopCannon.exe
          Compress-Archive -Path dist/DesktopCannon.exe -DestinationPath dist/DesktopCannon_portable_x64.zip
          Remove-Item dist/DesktopCannon.exe
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/DesktopCannon_x64-setup.exe

      - name: 上传构建产物（安装版 + 绿色版）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cannon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 上传浏览器 UI 冒烟测试截图
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cannon-ui-evidence
          path: docs/browser_preview_*.png
          if-no-files-found: warn

      - name: 计算统一发布版本
        id: release_info
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Tag $env:GITHUB_REF does not match package.json version $version"
          }

      - name: 正式发布（Tag 或主分支版本提交）
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'chore(release): v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Desktop Cannon ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Desktop Cannon Windows installer and portable build.
            Release artifacts are produced only after Node tests, Chromium UI smoke,
            asset validation, Rust unit tests and Windows native build pass.
            Explorer visual effects and DPI behavior still require real interactive
            Windows desktop acceptance (docs/WINDOWS_ACCEPTANCE.md).
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip
