name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 编译
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 构建安装版与绿色版
        run: npm run build

      - name: 整理绿色版（便携 zip）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/desktop-cannon.exe dist/DesktopCannon.exe
          Compress-Archive -Path dist/DesktopCannon.exe -DestinationPath dist/DesktopCannon_portable_x64.zip
          Remove-Item dist/DesktopCannon.exe
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/DesktopCannon_x64-setup.exe

      - name: 上传构建产物（安装版 + 绿色版）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cannon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 发布 Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip
          generate_release_notes: true
