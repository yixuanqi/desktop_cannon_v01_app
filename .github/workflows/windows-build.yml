name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 编译
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 运行自动化测试
        run: npm test

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装素材测试依赖
        run: python -m pip install numpy pillow

      - name: 校验小炮美术网格帧
        run: python scripts/validate_mesh.py

      - name: 构建安装版与绿色版
        run: npm run build

      - name: 整理绿色版（便携 zip）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/desktop-cannon.exe dist/DesktopCannon.exe
          Compress-Archive -Path dist/DesktopCannon.exe -DestinationPath dist/DesktopCannon_portable_x64.zip
          Remove-Item dist/DesktopCannon.exe
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/DesktopCannon_x64-setup.exe

      - name: 上传构建产物（安装版 + 绿色版）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cannon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 发布 v0.6.6 RC1 测试安装包（只运行一次）
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release): v0.6.6-rc.1')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.6-rc.1
          name: Desktop Cannon v0.6.6 RC1 - Windows window repair test
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Windows 实机测试候选版：修复桌面小炮被其他窗口遮挡及 DPI 缩放导致窗口尺寸异常。
            下载 DesktopCannon_x64-setup.exe（安装版）或 DesktopCannon_portable_x64.zip（绿色便携版）。
            请关闭旧进程后再启动；重点核查 TRAE 前台、托盘隐藏/显示、125%/150% DPI。
            本版尚待真实 Windows 桌面验收，未宣称问题完全解决。
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip

      - name: 发布 Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip
          generate_release_notes: true
