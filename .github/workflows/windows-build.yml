name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 编译
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 运行自动化测试
        run: npm test

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装素材测试依赖
        run: python -m pip install numpy pillow

      - name: 校验小炮美术网格帧
        run: python scripts/validate_mesh.py

      - name: 构建安装版与绿色版
        run: npm run build

      - name: 整理绿色版（便携 zip）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/desktop-cannon.exe dist/DesktopCannon.exe
          Compress-Archive -Path dist/DesktopCannon.exe -DestinationPath dist/DesktopCannon_portable_x64.zip
          Remove-Item dist/DesktopCannon.exe
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName dist/DesktopCannon_x64-setup.exe

      - name: 上传构建产物（安装版 + 绿色版）
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cannon-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 发布 v0.6.6 最新正式下载包（仅本次合并触发）
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'chore(release): v0.6.6')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.6
          name: Desktop Cannon v0.6.6 - Windows window repair
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body: |
            Windows 修复版本：改善 Desktop Cannon 在其他桌面窗口前显示被遮挡，以及 DPI / 显示变化造成的大炮窗口裁切的问题。
            下载 DesktopCannon_x64-setup.exe（Windows 安装版）或 DesktopCannon_portable_x64.zip（绿色版）。
            本次已通过 Windows 构建与自动化检查。真实 Windows 桌面仍需用户体验反馈，不能保证所有窗口管理器和缩放配置下均已解决。
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip

      - name: 发布 Release（仅 v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopCannon_x64-setup.exe
            dist/DesktopCannon_portable_x64.zip
          generate_release_notes: true
