[package]
name = "desktop-cannon"
version = "0.6.5"
edition = "2021"
description = "Cute desktop cannon with a click-through overlay"

[lib]
name = "desktop_cannon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_System_Com"] }

# Only for opt-in single-icon in-memory wallpaper matching; not used when disabled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
base64 = "0.22"
