<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/><title>桌面小炮 · 交互窗</title><link rel="stylesheet" href="/cannon.css"/></head>
<body><main id="cannon-root" aria-label="桌面小炮">
  <div class="cannon-scene" id="scene" data-state="idle">
    <div class="cannon-rig" id="rig">
      <div class="squash-wrap" id="recoil" aria-label="按住炮身移动整门小炮">
        <img class="mesh-frame" id="mesh-frame" src="/assets/mesh/frames/pitch_08.png" draggable="false" alt="奶油金小炮、绿色嫩芽与兔子木轮" />
      </div>
      <div class="lever-axis" id="lever-axis">
        <div class="bolt-spring" id="bolt-spring" aria-hidden="true"></div>
        <div class="bolt" id="bolt" role="button" tabindex="0" aria-label="向右拖动蓄力，上下拖动轻微调整炮口俯仰，松手发射"><img src="/assets/part_bolt_knob.png" alt="" draggable="false" /></div>
      </div>
    </div>
    <div class="fire-flash" id="flash"></div>
    <div class="power" id="power" aria-live="off"><div class="power-label"><span>蓄力 <strong id="power-number">0%</strong></span><span>仰角 <strong id="angle-number">34°</strong></span></div><div class="power-track"><div id="power-fill"></div></div></div>
    <p class="hint" id="hint">按住炮身移动 · 拉红球蓄力 / 上下微调</p>
  </div>
</main><script type="module" src="/js/cannon.mjs"></script></body></html>
